# @package _global_

agent:
  _recursive_: False
  config:
    # data loader parameters
    batch_size: 256 # it should be bigger than the len(motion)
    window_size: 16  # ~0.5 seconds at 30 FPS (16 frames / 30 fps = 0.53s)
    num_workers: 4
    normalize_observations: false  # Normalize motion data using mean/std statistics

    # optimization parameters
    total_iter: 100000
    warmup_iter: 1000
    lr: 2e-4
    lr_scheduler: [50000, 100000]
    gamma: 0.05
    weight_decay: 0.0
    commit: 0.02
    loss_vel: 0.5
    recons_loss: 'l1_smooth'
    
    # model parameters # optimized for motion accuracy
    num_joints: 24  # Default for SMPL
  
    # Reduced codebook size for better representation learning
    code_dim: 256 # keep same embedding dimension
    nb_code: 256 # - minimal but expressive representation
    mu: 0.99
    down_t: 2
    stride_t: 2
    # Increased model capacity for better reconstruction
    width: 768 # increased from 512 for more representational power
    depth: 4 # increased from 3 for deeper features
    dilation_growth_rate: 2 # reduced from 3 for more stable training
    output_emb_width: 256 # keep same to match code_dim
    vq_act: 'gelu' # better than relu for motion data
    vq_norm: 'layer' # add layer normalization for stability

    # quantizer - improved settings
    quantizer: 'ema_reset'
    beta: 1.0
    
    # additional training improvements
    gradient_clip: 1.0  # gradient clipping for stability
    validation_freq: 500  # validate more frequently
    early_stopping_patience: 10  # patience for early stopping
    use_mixed_precision: false  # can enable for faster training if stable
    
    # Policy ID auxiliary loss parameters
    use_policy_loss: false  # Enable policy ID classification auxiliary loss
    policy_loss_weight: 0.1  # Weight for policy loss in total loss
    use_policy_loss_warmup: false  # Use policy loss during warmup (optional)
    policy_classifier_hidden_dim: 256  # Hidden dimension for policy classifier
    policy_classifier_layers: 2  # Number of layers in policy classifier
    policy_classifier_dropout: 0.1  # Dropout rate for policy classifier
    # Policy prediction mode
    policy_use_sequence_wise: false  # If true: predict policy ID per timestep (sequence-wise). If false: predict one policy ID per window (chunk-wise)
    # Transition-aware policy loss (for mixed policy IDs in windows) - only used for chunk-wise mode
    policy_use_soft_labels: false  # Use soft labels (distribution) for transition windows, hard labels for stable windows (chunk-wise only)
    policy_transition_weight: 2.0  # Weight multiplier for transition windows (rare but important) (chunk-wise only)
    policy_classifier_architecture: "cnn1d"  # Architecture: "mlp", "cnn1d", "lstm", or "transformer" (for chunk-wise) / "lstm", "transformer", or "cnn1d" (for sequence-wise)
    # MLP: Fastest, no temporal modeling (average pooling)
    # CNN1D: Fast, captures local temporal patterns, parallelizable (recommended)
    # LSTM: Good temporal modeling, moderate speed
    # Transformer: Best for long-range dependencies, slower but parallelizable
    policy_classifier_num_heads: 8  # Number of attention heads (for transformer only)
    policy_classifier_kernel_size: 3  # Kernel size for CNN1D convolutions
    
    # Latent Predictor - Simple MLP for dynamics learning
    use_latent_predictor: false
    latent_predictor_weight: 0.1
    latent_predictor_hidden_dim: 256
    latent_predictor_layers: 2
    latent_predictor_dropout: 0.1
    latent_predictor_pred_len: 1

    
    # Wandb parameters
    use_wandb: true
    wandb_project: "amass-vqvae-mvq"
    wandb_run_name: ${wandb_run_name}
    wandb_tags: [] 
           
    # Logging and saving
    save_every: 1000
    print_iter: 500
    seed: 123
